name: Daily FinMind status

on:
  schedule:
    # Shifted off Taiwan daytime (was UTC 01:30/02:30/03:30 = Taiwan 09:30/10:30/11:30,
    # overlapping when other scripts/people are most likely to also be drawing on the
    # same shared FINMIND_TOKEN1-6 pool) to Taiwan's quiet overnight window instead.
    # GitHub Actions cron is always UTC with no timezone setting, so day-of-week/
    # day-of-month fields below are UTC, not Taiwan, days:
    - cron: "30 16 * * *"    # Daily types (1,5,13) — Taiwan 00:30
    # Weekly types are kept away from the daily runs above/below. GitHub
    # often starts scheduled runs hours late, so the old single Sunday 17:30 run landed in
    # the same hour as the daily 1,5,13 run, found the token pool exhausted, and skipped
    # every FinMind-API type (4,6,7,9,11,19) week after week.
    # One FinMind-API type per run, 90 min apart: the 7-token hourly quota only covers about
    # one full type (125 stocks x several datasets). Batching 3-5 types per run tripped the
    # global rate-limit flag after the first type and skipped the rest (seen 2026-11-10).
    - cron: "0 6 * * 6"      # Sat type 4   — UTC 06:00 = Taiwan 14:00
    - cron: "30 7 * * 6"     # Sat type 6   — UTC 07:30 = Taiwan 15:30
    - cron: "0 9 * * 6"      # Sat type 7   — UTC 09:00 = Taiwan 17:00
    - cron: "30 10 * * 6"    # Sat type 8   — UTC 10:30 = Taiwan 18:30
    - cron: "0 6 * * 0"      # Sun type 9   — UTC 06:00 = Taiwan 14:00
    - cron: "30 7 * * 0"     # Sun type 11  — UTC 07:30 = Taiwan 15:30
    - cron: "0 9 * * 0"      # Sun type 17  — UTC 09:00 = Taiwan 17:00
    - cron: "30 10 * * 0"    # Sun types 19,14 (14 is local-only, built from type 13 data)
    - cron: "30 18 1 * *"    # Monthly types (12,15,16) — UTC day-of-month 1, 18:30 = Taiwan day 2, 02:30
                              # (cron can't express "last day of previous month", so this is the
                              # closest exact equivalent to "midnight-ish on the 1st, Taiwan time")
    - cron: "30 19 * * *"    # Daily type 18 alone — Taiwan 03:30, separated from other daily fetches
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-finmind-status.yml
  workflow_dispatch:
    inputs:
      types:
        description: "Comma-separated type IDs to run (e.g. '1,5,8'); leave empty to run every active type"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FINMIND_TOKEN1: ${{ secrets.FINMIND_TOKEN1 }}
      FINMIND_TOKEN2: ${{ secrets.FINMIND_TOKEN2 }}
      FINMIND_TOKEN3: ${{ secrets.FINMIND_TOKEN3 }}
      FINMIND_TOKEN4: ${{ secrets.FINMIND_TOKEN4 }}
      FINMIND_TOKEN5: ${{ secrets.FINMIND_TOKEN5 }}
      FINMIND_TOKEN6: ${{ secrets.FINMIND_TOKEN6 }}
      FINMIND_TOKEN7: ${{ secrets.FINMIND_TOKEN7 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download observation list
        run: python Get觀察名單.py
      - name: Fetch FinMind CSV data
        run: |
          TYPES_ARG=""
          if [ -n "${{ github.event.inputs.types }}" ]; then
            TYPES_ARG="--types ${{ github.event.inputs.types }}"
          else
            case "${{ github.event.schedule }}" in
              "0 6 * * 6")   TYPES_ARG="--types 4" ;;
              "30 7 * * 6")  TYPES_ARG="--types 6" ;;
              "0 9 * * 6")   TYPES_ARG="--types 7" ;;
              "30 10 * * 6") TYPES_ARG="--types 8" ;;
              "0 6 * * 0")   TYPES_ARG="--types 9" ;;
              "30 7 * * 0")  TYPES_ARG="--types 11" ;;
              "0 9 * * 0")   TYPES_ARG="--types 17" ;;
              "30 10 * * 0") TYPES_ARG="--types 19,14" ;;
            esac
          fi
          if [ -n "$TYPES_ARG" ]; then
            :
          elif [ "${{ github.event.schedule }}" = "30 18 1 * *" ]; then
            TYPES_ARG="--types 12,15,16"
          elif [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
            TYPES_ARG="--types 1,5,13"
          elif [ "${{ github.event.schedule }}" = "30 19 * * *" ] || [ "${{ github.event_name }}" = "push" ]; then
            TYPES_ARG="--types 18"
          fi
          python scripts/fetch_daily_finmind.py --stock-list StockID_TWSE_TPEX.csv $TYPES_ARG
      - name: Update README status
        if: always()
        continue-on-error: true
        run: python scripts/download_results_counts.py --stock-list StockID_TWSE_TPEX.csv --update-readme
      - name: Build stage1_raw combined CSVs
        if: always()
        continue-on-error: true
        run: python scripts/build_stage1_raw.py
      - name: Commit status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md financial/ data/stage1_raw/
          git diff --cached --quiet || git commit -m "chore: update daily FinMind status"
          git push
      - name: Sync refreshed CSVs to biztrends.TW
        id: sync_biztrends
        continue-on-error: true  # retried below on failure (e.g. biztrends.TW ref-lock race)
        if: always()
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-to-biztrends.yml
          COMMIT_EACH_FILE: false
          SKIP_PR: true

      - name: Wait before retrying biztrends.TW sync
        if: steps.sync_biztrends.outcome == 'failure'
        run: sleep $((45 + RANDOM % 90))

      - name: Sync refreshed CSVs to biztrends.TW (retry)
        if: steps.sync_biztrends.outcome == 'failure'
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-to-biztrends.yml
          COMMIT_EACH_FILE: false
          SKIP_PR: true
