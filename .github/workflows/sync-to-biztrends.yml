name: Sync to biztrends.TW

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/stage1_raw/**"
      - ".github/sync-to-biztrends.yml"
      - ".github/workflows/sync-to-biztrends.yml"
  schedule:
    # daily-finmind-status.yml commits with the default GITHUB_TOKEN, which per
    # GitHub's own limitation never fires other workflows' `on: push` (avoids
    # infinite loops) -- so the push trigger above never actually runs in
    # practice. This schedule is the real trigger: run a few hours after the
    # latest daily-finmind-status.yml cron (30 1 * * *) has had time to finish
    # (it's taken anywhere from ~5 to ~40 minutes in recent runs).
    - cron: "30 4 * * *"

concurrency:
  group: sync-biztrends
  cancel-in-progress: true

jobs:
  sync-to-biztrends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync to biztrends.TW
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-to-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true
